<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terminal — HackWithJordan</title>
    <meta name="description" content="An interactive terminal toy. Type help to see what it can do.">

    <style>
        :root {
            --bg: #0b0e14;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.065);
            --border: rgba(255, 255, 255, 0.09);
            --border-hover: rgba(94, 234, 212, 0.45);
            --text: #e8edf2;
            --muted: #8b97a6;
            --accent: #5eead4;
            --accent-dim: rgba(94, 234, 212, 0.14);
            --violet: #7c8cf8;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            --mono: 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Consolas, 'SF Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; background: var(--bg); }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            line-height: 1.65;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        ::selection { background: var(--accent-dim); color: var(--accent); }

        /* ---------- Interactive background ---------- */
        #bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .blob {
            position: fixed;
            z-index: 0;
            border-radius: 50%;
            filter: blur(110px);
            pointer-events: none;
            will-change: transform;
        }
        .blob-1 {
            width: 55vw; height: 55vw;
            top: -18vw; left: -12vw;
            background: radial-gradient(circle, rgba(45, 212, 191, 0.16), transparent 65%);
            animation: drift1 26s ease-in-out infinite alternate;
        }
        .blob-2 {
            width: 48vw; height: 48vw;
            bottom: -16vw; right: -10vw;
            background: radial-gradient(circle, rgba(124, 140, 248, 0.14), transparent 65%);
            animation: drift2 32s ease-in-out infinite alternate;
        }
        .blob-3 {
            width: 34vw; height: 34vw;
            top: 40%; left: 55%;
            background: radial-gradient(circle, rgba(94, 234, 212, 0.08), transparent 65%);
            animation: drift3 22s ease-in-out infinite alternate;
        }
        @keyframes drift1 { to { transform: translate(9vw, 7vw) scale(1.12); } }
        @keyframes drift2 { to { transform: translate(-8vw, -6vw) scale(1.08); } }
        @keyframes drift3 { to { transform: translate(-12vw, 9vw) scale(0.9); } }

        main, header, footer { position: relative; z-index: 1; }

        /* ---------- Nav ---------- */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 32px;
            background: rgba(11, 14, 20, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }
        .brand {
            font-family: var(--mono);
            font-size: 0.95rem;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 0.02em;
        }
        .brand .prompt { color: var(--accent); }
        .cursor {
            display: inline-block;
            color: var(--accent);
            animation: blink 1.1s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .nav nav { display: flex; gap: 26px; }
        .nav nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color  0.2s ease;
        }
        .nav nav a:hover { color: var(--accent); }
        .nav nav a.active { color: var(--accent); }

        /* ---------- Layout ---------- */
        .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }
        main { flex: 1; display: flex; flex-direction: column; }
        main .wrap { flex: 1; display: flex; flex-direction: column; }

        /* ---------- Hero ---------- */
        .hero {
            min-height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 90px;
        }
        .terminal-hero {
            min-height: auto;
            flex: 1;
            padding-top: 120px;
            padding-bottom: 20px;
        }
        .eyebrow {
            font-family: var(--mono);
            color: var(--accent);
            font-size: 0.9rem;
            margin-bottom: 18px;
        }
        .hero h1 {
            font-size: clamp(2.6rem, 6vw, 4.2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        .hero h1 .accent { color: var(--accent); }
        .lede {
            margin-top: 22px;
            max-width: 620px;
            font-size: 1.12rem;
            color: var(--muted);
        }
        .lede code {
            font-family: var(--mono);
            font-size: 0.92em;
            color: var(--accent);
            background: var(--accent-dim);
            border-radius: 5px;
            padding: 1px 6px;
        }

        /* ---------- Terminal shell ---------- */
        .terminal-shell {
            margin-top: 40px;
            background: rgba(6, 10, 14, 0.82);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
        }
        .terminal-bar .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dot-r { background: #ff5f57; }
        .dot-y { background: #febc2e; }
        .dot-g { background: #28c840; }
        .terminal-bar .title {
            font-family: var(--mono);
            font-size: 0.78rem;
            color: var(--muted);
            margin-left: 8px;
        }
        #terminal-container {
            padding: 22px 24px;
            font-family: var(--mono);
            font-size: 0.92rem;
            line-height: 1.7;
            min-height: 380px;
            max-height: 65vh;
            overflow-y: auto;
            color: var(--text);
        }
        #terminal-container .output {
            white-space: pre-wrap;
            word-break: break-word;
        }
        #terminal-container .command-list {
            white-space: pre-wrap;
            color: var(--muted);
        }
        #terminal-container .command-display {
            white-space: pre-wrap;
            word-break: break-word;
        }
        #terminal-container .prompt-line {
            display: flex;
            align-items: baseline;
        }
        #terminal-container .prompt {
            font-weight: 600;
        }
        #terminal-container .command-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: var(--mono);
            font-size: inherit;
            line-height: inherit;
            color: inherit;
            caret-color: var(--accent);
            padding: 0;
        }
        #terminal-container::-webkit-scrollbar { width: 10px; }
        #terminal-container::-webkit-scrollbar-track { background: transparent; }
        #terminal-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 999px;
        }

        /* ---------- Footer ---------- */
        footer {
            border-top: 1px solid var(--border);
            padding: 34px 0;
            margin-top: 40px;
        }
        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }
        .footer-inner .copy { font-size: 0.85rem; color: var(--muted); }
        .socials { display: flex; gap: 22px; }
        .socials a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .socials a:hover { color: var(--accent); }

        /* ---------- Reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none; }
            .cursor { animation: none; }
            html { scroll-behavior: auto; }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 760px) {
            .nav { padding: 14px 20px; }
            .nav nav { gap: 16px; }
            #terminal-container { padding: 18px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <footer>

    <script>
        // ---------- Particle background ----------
        (function () {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const mouse = { x: null, y: null };
            let particles = [];
            let w = 0, h = 0;

            function resize() {
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w * dpr;
                canvas.height = h * dpr;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                seed();
            }

            function seed() {
                const count = Math.min(90, Math.floor((w * h) / 16000));
                particles = [];
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35,
                        r: Math.random() * 1.5 + 0.7
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, w, h);

                for (const p of particles) {
                    // gentle drift
                    p.x += p.vx;
                    p.y += p.vy;

                    // wrap around edges
                    if (p.x < -20) p.x = w + 20;
                    if (p.x > w + 20) p.x = -20;
                    if (p.y < -20) p.y = h + 20;
                    if (p.y > h + 20) p.y = -20;

                    // cursor parts the field gently, then it flows back on its own
                    if (mouse.x !== null) {
                        const dx = p.x - mouse.x;
                        const dy = p.y - mouse.y;
                        const d = Math.hypot(dx, dy);
                        if (d < 120 && d > 0.001) {
                            const f = (1 - d / 120) * 0.5;
                            p.x += (dx / d) * f;
                            p.y += (dy / d) * f;
                        }
                    }
                }

                // connecting lines between particles
                for (let i = 0; i < particles.length; i++) {
                    const a = particles[i];
                    for (let j = i + 1; j < particles.length; j++) {
                        const b = particles[j];
                        const d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d < 110) {
                            ctx.strokeStyle = 'rgba(94, 234, 212, ' + (0.14 * (1 - d / 110)).toFixed(3) + ')';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.stroke();
                        }
                    }
                    // lines to the cursor
                    if (mouse.x !== null) {
                        const d = Math.hypot(a.x - mouse.x, a.y - mouse.y);
                        if (d < 140) {
                            ctx.strokeStyle = 'rgba(124, 140, 248, ' + (0.18 * (1 - d / 140)).toFixed(3) + ')';
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(mouse.x, mouse.y);
                            ctx.stroke();
                        }
                    }
                }

                // dots
                for (const p of particles) {
                    ctx.fillStyle = 'rgba(232, 237, 242, 0.5)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function loop() {
                if (!document.hidden) draw();
                requestAnimationFrame(loop);
            }

            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', function (e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener('mouseleave', function () {
                mouse.x = null;
                mouse.y = null;
            });

            resize();
            if (reduced) {
                draw(); // one static frame
            } else {
                requestAnimationFrame(loop);
            }
        })();
    </script>
    <script defer src="assets/js/terminal.js"></script>
</body>
